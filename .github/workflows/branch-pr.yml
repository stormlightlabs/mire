# Opens a draft pull request for an agent's work branch (claude/, codex/ or
# storm/) as stormlight-thunderbot, so the owner can approve it under the
# ruleset on main. Ported from desertthunder/knowledgebase.
#
# `fab branch-pr` takes the title from the branch's first commit subject and
# the body from that commit's body as the squash keeps it, so it needs no
# model. A pull request already open keeps its title and body. The pull
# request stays a draft until its review finishes; the Review gate then marks
# it ready and sets the squash message, and the owner merges it, by hand or
# with auto-merge. Nothing here turns auto-merge on.
#
# `fab` comes from the branch, as this workflow does: in fabrial it is built
# from the branch, and elsewhere it is the release the branch's
# .github/fabrial.toml names, so a branch that runs `fab update` gets the
# release it updates to. In fabrial, a first push that does not build opens
# no pull request; once it builds, run this from the Actions tab.
#
# It runs only on the push that creates the branch; later pushes skip the job,
# which costs no runner time. A branch pushed with no commits ahead of main,
# one whose first run failed, or one whose pull request was closed, gets its
# pull request when this is run on that branch from the Actions tab or with
# `gh workflow run branch-pr.yml --ref <branch>`.
name: Branch PR

on:
  push:
    branches: ["claude/**", "codex/**", "storm/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr:
    # No concurrency group: a second quick push must not cancel the run that
    # the branch's creation started, since its own job is skipped.
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.created) &&
      (startsWith(github.ref_name, 'claude/') || startsWith(github.ref_name, 'codex/') ||
       startsWith(github.ref_name, 'storm/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.THUNDERBOT_APP_ID }}
          private-key: ${{ secrets.THUNDERBOT_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/fab
        with:
          command: branch-pr

      - name: Open the PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          HEAD_DIR: .
        run: fab branch-pr
