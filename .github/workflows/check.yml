# The check a pull request into main must pass. A ruleset on main can require
# the job named `check`.
name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: extractions/setup-just@v3

      - run: just check

  # Drives the browser review surface through the built `mire serve` binary.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: extractions/setup-just@v3

      - run: pnpm --filter @stormlightlabs/mire-app exec playwright install --with-deps chromium

      - run: just e2e

      # Traces hold the session secret, which only authorizes the runner's
      # localhost server and ends with the job.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: packages/app/test-results
          retention-days: 7
