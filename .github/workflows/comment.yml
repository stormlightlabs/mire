# Posts a comment on a pull request as stormlight-thunderbot. Agent sessions
# never hold the App's key, so they post through this workflow instead of with
# their own GitHub access, which would show the comment as the person whose
# account the session uses:
#
#   gh workflow run comment.yml -f pr=<n> -f body="$(cat comment.md)"
#
# or, through the GitHub MCP tools, actions_run_trigger with method
# run_workflow, workflow_id comment.yml, ref main and the same inputs.
#
# With `section`, such as `-f section="Standard pass"`, the body becomes that
# section of the bot's status comment on the pull request instead of a new
# comment: `fab pr-status` posts the status comment once and edits it after,
# and an edit sends the owner no notification.
name: Bot comment

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      body:
        description: Comment text, in Markdown
        required: true
      section:
        description: A status comment section to set instead of posting a comment
        required: false
        default: ""

permissions:
  contents: read

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.THUNDERBOT_APP_ID }}
          private-key: ${{ secrets.THUNDERBOT_PRIVATE_KEY }}

      - name: Check the pull request
        env:
          PR: ${{ inputs.pr }}
          BODY: ${{ inputs.body }}
        run: |
          if [[ ! $PR =~ ^[0-9]+$ ]]; then
            echo "::error title=pr::'$PR' is not a pull request number."
            exit 1
          fi
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/body.md"

      # A section needs fab, from the default branch as the Review gate
      # takes it, whatever ref the run was dispatched on.
      - uses: actions/checkout@v5
        if: inputs.section != ''
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: ./.github/actions/fab
        if: inputs.section != ''
        with:
          command: pr-status

      - name: Post the comment
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          SECTION: ${{ inputs.section }}
        run: |
          if [[ -n $SECTION ]]; then
            fab pr-status --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/body.md"
          fi
