# Keeps the storm/review check, which the ruleset on main requires. The agent
# that opened a pull request reviews it in its own session with the `storm`
# skill and ends with `Review finished at <sha>`, posted as the bot through the
# Bot comment workflow (or by the owner, a member or a collaborator). It runs
# no model: `fab gate` marks each new head pending, turns the check green on
# that comment or on `/storm:ready <sha>`, and answers `/storm:stop`. An edit
# to the title or body sets the squash message again, in the status comment.
#
# pull_request_target runs this file from main, and `fab` is the release
# .github/fabrial.toml names (in fabrial itself, built from main), so a change
# cannot alter its own gate. The head is checked out only for git to read.
name: Review gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read

# Edits to one pull request run one at a time, so the last run reads the last
# text. Other events get a group of their own and never wait.
concurrency:
  group: ${{ github.event.action == 'edited' && format('gate-edit-{0}', github.event.pull_request.number) || format('gate-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       ((startsWith(github.event.comment.body, 'Review finished at ') &&
         github.event.comment.user.login == 'stormlight-thunderbot[bot]') ||
        ((startsWith(github.event.comment.body, 'Review finished at ') ||
          startsWith(github.event.comment.body, '/storm:ready') ||
          startsWith(github.event.comment.body, '/storm:stop')) &&
         github.event.comment.user.type != 'Bot' &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.THUNDERBOT_APP_ID }}
          private-key: ${{ secrets.THUNDERBOT_PRIVATE_KEY }}

      # A push run works on the head its event names, not the newest one, so
      # runs need no ordering: each sets the check on its own commit. A comment
      # run reads the head when it starts and accepts only a SHA naming it.
      - name: Find the head
        id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "sha=${EVENT_SHA:-$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false

      # fabrial builds its own gate from main; a repository that installs
      # fabrial runs the release that wrote its files.
      - uses: ./.github/actions/fab
        with:
          command: gate

      - name: Set the check
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
          EVENT: ${{ github.event_name == 'issue_comment' && 'comment' || github.event.action == 'edited' && 'edit' || 'push' }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          BODY: ${{ github.event.comment.body }}
          AUTHOR: ${{ github.event.comment.user.login }}
          SENDER: ${{ github.event.sender.login }}
        run: fab gate
