# git-cliff turns the conventional-commit subjects on main into changelog
# entries. Squash merges make each pull request title one entry.

[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Pre-release cleanup. Before the first release, main held commits made before
# PR titles became the subject: internal planning docs, docs-site internals and
# terse subjects. The sha parsers at the top of commit_parsers leave the
# internal ones out, and these preprocessors rewrite the terse subjects. Both
# key on the commit's full SHA. Do not add to either list: later commits take
# their entry from the PR title. scripts/changelog-check.sh fails when an old
# subject comes back.
#
# A preprocessor runs its command only on a message that starts with the exact
# subject, and the command replaces the message only when $COMMIT_SHA matches.
# The commands need a POSIX sh.
commit_preprocessors = [
    { pattern = '\Adocs: add license & README(\n|\z)', replace_command = "[ $COMMIT_SHA = cfa0afcee440f490f2d4f2a4bac215508ffdcf49 ] && { cat >/dev/null; echo 'docs: add the license and README'; } || cat" },
    { pattern = '\Afeat: patch JSON normalization cmd(\n|\z)', replace_command = "[ $COMMIT_SHA = 6255aa60703a68fe7a600ff5a7931a8cc7ea2338 ] && { cat >/dev/null; echo 'feat: add `mire patch` to read a patch file or standard input and print it as JSON'; } || cat" },
    { pattern = '\Afeat: Git-backed diff and show cmds(\n|\z)', replace_command = "[ $COMMIT_SHA = 0469e4cd01712c9ef564b97776c46dd527d31746 ] && { cat >/dev/null; echo 'feat: add `mire diff` and `mire show` to review worktree changes, revision ranges and commits'; } || cat" },
    { pattern = '\Afeat: interactive TUI review(\n|\z)', replace_command = "[ $COMMIT_SHA = 3aa570c489cfc24fb74d5f7e584a37e711608338 ] && { cat >/dev/null; echo 'feat: review changes in an interactive terminal UI'; } || cat" },
    { pattern = '\Afeat: add review navigation and layout modes(\n|\z)', replace_command = "[ $COMMIT_SHA = f6e352f5da823527f4c89cd28ec23d934f7b6dbd ] && { cat >/dev/null; echo 'feat: add file sidebar navigation and unified and split layouts to the terminal review'; } || cat" },
    { pattern = '\Afeat: better ui(\n|\z)', replace_command = "[ $COMMIT_SHA = 4e88f4162056980984f6665fb669193d4d17181c ] && { cat >/dev/null; echo 'feat: add syntax highlighting, changed-word highlighting, search across files, context expansion, line wrapping and `--language` to the terminal review'; } || cat" },
    { pattern = '\Afeat: review model and atomic file IO(\n|\z)', replace_command = "[ $COMMIT_SHA = d5745ee04d53725a9a002894eb28169ab11598f4 ] && { cat >/dev/null; echo 'feat: add review files that hold anchored notes, written atomically, and open them with `mire review`'; } || cat" },
    { pattern = '\Afeat: selectable TUI themes(\n|\z)', replace_command = "[ $COMMIT_SHA = ec70ef8a4c9bffba9e849b7084ec45f443222eb1 ] && { cat >/dev/null; echo 'feat: select the Iceberg, Eldritch or Catppuccin theme with `--theme`'; } || cat" },
    { pattern = '\Afeat: review protocol(\n|\z)', replace_command = "[ $COMMIT_SHA = 81fb360ff7275476bb9b96518b254b0b37072934 ] && { cat >/dev/null; echo 'feat: add `mire context` and `mire notes import`, `list` and `export` so agents can read a review and write notes'; } || cat" },
    { pattern = '\Afeat: terminal review note editing(\n|\z)', replace_command = "[ $COMMIT_SHA = 3b53b72a42c422b9f2cbf817ccbf04dfbfdaafd0 ] && { cat >/dev/null; echo 'feat: write, edit, filter and set the status of notes in the terminal review'; } || cat" },
    { pattern = '\Afeat: filesystem watch mode(\n|\z)', replace_command = "[ $COMMIT_SHA = f86cc87e904aebf1ca3256e8cc8b77c60e53912d ] && { cat >/dev/null; echo 'feat: reload Git comparisons, patch files and review files as they change, with `--watch` and `mire watch`'; } || cat" },
    { pattern = '\Afeat: review init cmd(\n|\z)', replace_command = "[ $COMMIT_SHA = 65d20d7e0012eafc5cc810246f97cd772d41b0d2 ] && { cat >/dev/null; echo 'feat: add `mire review init` to create a review file from a Git comparison'; } || cat" },
    { pattern = '\Afeat: location-based note commands(\n|\z)', replace_command = "[ $COMMIT_SHA = 164870954b93f84a5c58e3b9b8adc9a4d0228090 ] && { cat >/dev/null; echo 'feat: add `mire note add` and `mire notes apply` to write findings at a file and line, and `mire note resolve`, `dismiss` and `accept-risk`'; } || cat" },
    { pattern = '\Afeat: bundled skill with command(\n|\z)', replace_command = "[ $COMMIT_SHA = 229786cb3affc92748e4bfe2a997d1fab1675cd3 ] && { cat >/dev/null; echo 'feat: bundle an agent review skill, installed and located with `mire skill path`'; } || cat" },
    { pattern = '\Afeat: bind reviews to Git repo identity(\n|\z)', replace_command = "[ $COMMIT_SHA = 601f6eef57451abf38b3056e8fbe92d09465717c ] && { cat >/dev/null; echo 'feat: record the Git repository and comparison a review was created from'; } || cat" },
    { pattern = '\Afeat: review refresh reanchoring(\n|\z)', replace_command = "[ $COMMIT_SHA = ed4ac28afbe4a4b7ee8c388c99948f8d798211f3 ] && { cat >/dev/null; echo 'feat: add `mire review refresh` to capture the comparison again and re-anchor findings as exact, moved, stale or ambiguous'; } || cat" },
    { pattern = '\Afeat: export note events and reanchor outcomes(\n|\z)', replace_command = "[ $COMMIT_SHA = 91d102342ad921f85ad7f9d68b9a45b5be156fe3 ] && { cat >/dev/null; echo 'feat: include note events and re-anchor results in `mire notes export`'; } || cat" },
    { pattern = '\Afeat: add live TUI session control(\n|\z)', replace_command = "[ $COMMIT_SHA = bd01bbce0f02303e8cd99f237ebb3a406ba4f6b7 ] && { cat >/dev/null; echo 'feat: add `mire session` commands to inspect and steer an open terminal review'; } || cat" },
    { pattern = '\Afeat: contextual TUI keyboard hints(\n|\z)', replace_command = "[ $COMMIT_SHA = bf30007c4ed34ace0338b0ac4cc4584491df4430 ] && { cat >/dev/null; echo 'feat: show the keys for the current mode in the terminal review footer'; } || cat" },
    { pattern = '\Afeat: make file sidebar toggleable(\n|\z)', replace_command = "[ $COMMIT_SHA = d1d9a3262ee23bfb9a5f636142fb383d58804b01 ] && { cat >/dev/null; echo 'feat: show or hide the file sidebar in the terminal review with `b`'; } || cat" },
    { pattern = '\Afeat: improve TUI note editing and status chrome(\n|\z)', replace_command = "[ $COMMIT_SHA = 847ffe10086119b91bb8d7b451d0724365bea0fe ] && { cat >/dev/null; echo 'feat: edit multiline notes and show review progress in the terminal review'; } || cat" },
    { pattern = '\Afeat: collapsible diff rows and file picker(\n|\z)', replace_command = "[ $COMMIT_SHA = 2e4bb38595ed675681ea1d51a983178fb6ca1e1c ] && { cat >/dev/null; echo 'feat: collapse files and hunks, and pick files from a filtered list, in the terminal review'; } || cat" },
    { pattern = '\Afeat: add review status and default diff(\n|\z)', replace_command = "[ $COMMIT_SHA = 904cd1037324eee2d10758dc418478a1d5a2ad39 ] && { cat >/dev/null; echo 'feat: add `mire review status`, and open the worktree diff when `mire` runs without a command'; } || cat" },
    { pattern = '\Afeat: local browser review server(\n|\z)', replace_command = "[ $COMMIT_SHA = d546205c47972e9266c5d1195aa3a9b4cc8017f1 ] && { cat >/dev/null; echo 'feat: add `mire serve` to open a web review in a local browser'; } || cat" },
    { pattern = '\Afeat: add file diff and finding navigation(\n|\z)', replace_command = "[ $COMMIT_SHA = d048bb9cf6f452ea977dce307085720bce6a118b ] && { cat >/dev/null; echo 'feat: add file diffs and finding navigation to the web review'; } || cat" },
    { pattern = '\Afeat: review patch export(\n|\z)', replace_command = "[ $COMMIT_SHA = a1f915a4d58f30c2fdac5fceab754c3dfe3cf7d7 ] && { cat >/dev/null; echo 'feat: add `mire review export --format patch` to write the captured changes as a patch'; } || cat" },
    { pattern = '\Afeat: finding review actions(\n|\z)', replace_command = "[ $COMMIT_SHA = 3ccf936a5486182d289c8a39221b32db68ecfe64 ] && { cat >/dev/null; echo 'feat: edit findings and resolve, reopen, dismiss or accept their risk in the web review'; } || cat" },
    { pattern = '\Afeat: web review refresh and completion(\n|\z)', replace_command = "[ $COMMIT_SHA = 976a07c6506ecda786cdfa6946f3892b2e815ec7 ] && { cat >/dev/null; echo 'feat: refresh the source and watch it for changes in the web review, and finish a review with Markdown, JSON and context downloads'; } || cat" },
    { pattern = '\Afeat: polish diff review interface(\n|\z)', replace_command = "[ $COMMIT_SHA = fb8e69ece622dbf739e4f06ffc14eacb2476c6b9 ] && { cat >/dev/null; echo 'feat: add a split layout, context expansion, a dark theme and mobile drawers to the web review'; } || cat" },
    { pattern = '\Afeat: add collapsible file tree navigation(\n|\z)', replace_command = "[ $COMMIT_SHA = f0446b2ce0fa768ec881fb60011242a8a6ded5a6 ] && { cat >/dev/null; echo 'feat: add a collapsible file tree to the web review'; } || cat" },
    { pattern = '\Adocs: build doc site(\n|\z)', replace_command = "[ $COMMIT_SHA = 27ab4cca10acb86ab7c976a1fa783869eaddaece ] && { cat >/dev/null; echo 'docs: add the documentation site'; } || cat" },
    { pattern = '\Adocs: update for completed review workflow(\n|\z)', replace_command = "[ $COMMIT_SHA = c4961f7c6348bf0c193ccfdaba82107c1c574f63 ] && { cat >/dev/null; echo 'docs: update the README for the review workflow'; } || cat" },
    { pattern = '\Adocs: add range and split screencaps(\n|\z)', replace_command = "[ $COMMIT_SHA = 751692a15765f217537b82599e0b4b9ed6f247ff ] && { cat >/dev/null; echo 'docs: add screencaps of a revision-range review and the split layout'; } || cat" },
]
commit_parsers = [
    # Pre-release cleanup: see commit_preprocessors.
    { sha = "525378028b73456c5857902ee315108755505043", skip = true }, # docs: plan the project
    { sha = "94a5f6c10f137d468cf31c4697d46496423c3f97", skip = true }, # docs: clarify tool annotation terminology in docs
    { sha = "1ee4cb6f20a0b86bb53095a5801f4cd39d0d8571", skip = true }, # feat: data model & fixture corpus
    { sha = "7608108d8355faae18b433678cb579bebcc3b1bd", skip = true }, # docs: theming
    { sha = "70c52602f9905bb9c976b781b58f6e8f0172bfd6", skip = true }, # docs: screencap vhs tape
    { sha = "492da48667fc95e4758a67bff6f64dfa7729fef1", skip = true }, # docs: refresh project planning docs
    { sha = "d160b199b745522bd78222fef5fa8dafaca7d0fe", skip = true }, # feat: reorganize docs landing page and add GitHub link
    { sha = "474cda5d32cf4f6a2ba48af8b53fc178101516bc", skip = true }, # feat: add terminal shot component to docs
    { sha = "6bbf1224bafb118ccd744bb0d27f23ea755d2001", skip = true }, # feat: docs SEO metadata and social previews
    { sha = "b31b07da53ee5ac8170f82afb46cf62fc19c8236", skip = true }, # docs: web review roadmap and tasks
    { sha = "2c277bed6fbe95d303ae8d4cc20fde49d5b3d1ab", skip = true }, # docs: cleanup task list
    { sha = "ed6a492a86171bf77baf9396d011eef1a529bcd7", skip = true }, # feat: refine review UI and docs
    { sha = "c14d1917f254e714184aff3afb12c5b6848b363b", skip = true }, # docs: research review tools for walkthroughs (#3)
    { sha = "7409651306712a910b1030c77524529481ed9ad7", skip = true }, # docs: add web review redesign boards (#7)
    { sha = "12f03a92333ffffd5470c4f26f924c18799df686", skip = true }, # docs: design checkpoints and viewed state (#14)
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Changed" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^(chore|ci|build|test|style)", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
