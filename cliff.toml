# git-cliff turns the conventional-commit subjects on main into changelog
# entries. Squash merges make each pull request title one entry.

[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Fail, rather than drop a commit, when a subject is not a conventional commit.
require_conventional = true
split_commits = false
# Pre-release cleanup. Before 0.1.0, main held internal docs commits and
# terse subjects from before PR titles became the subject. The sha parsers
# skip the internal ones. The preprocessors rewrite each terse subject, matched
# whole and kept to its conventional type, and the initial commit, so git-cliff
# fails on nothing. Each pattern must match the whole subject, so a squash
# commit, which ends in ` (#N)`, never matches. The one reason to add an entry:
# git-cliff rejects a subject that reached main, such as a hand-edited squash
# title. Add a preprocessor that rewrites that exact subject to a conventional
# one, or a sha parser that skips it.
commit_preprocessors = [
    { pattern = '\Ainitial commit(\n|\z)', replace = 'chore: initial commit$1' },
    { pattern = '\Adocs: add license & README(\n|\z)', replace = 'docs: add the license and README$1' },
    { pattern = '\Afeat: patch JSON normalization cmd(\n|\z)', replace = 'feat: add `mire patch` to read a patch file or standard input and print it as JSON$1' },
    { pattern = '\Afeat: Git-backed diff and show cmds(\n|\z)', replace = 'feat: add `mire diff` and `mire show` to review worktree changes, revision ranges and commits$1' },
    { pattern = '\Afeat: interactive TUI review(\n|\z)', replace = 'feat: review changes in an interactive terminal UI$1' },
    { pattern = '\Afeat: add review navigation and layout modes(\n|\z)', replace = 'feat: add file sidebar navigation and unified and split layouts to the terminal review$1' },
    { pattern = '\Afeat: better ui(\n|\z)', replace = 'feat: add syntax highlighting, changed-word highlighting, search across files, context expansion, line wrapping and `--language` to the terminal review$1' },
    { pattern = '\Afeat: review model and atomic file IO(\n|\z)', replace = 'feat: add review files that hold anchored notes, written atomically, and open them with `mire review`$1' },
    { pattern = '\Afeat: selectable TUI themes(\n|\z)', replace = 'feat: select the Iceberg, Eldritch or Catppuccin theme with `--theme`$1' },
    { pattern = '\Afeat: review protocol(\n|\z)', replace = 'feat: add `mire context` and `mire notes import`, `list` and `export` so agents can read a review and write notes$1' },
    { pattern = '\Afeat: terminal review note editing(\n|\z)', replace = 'feat: write, edit, filter and set the status of notes in the terminal review$1' },
    { pattern = '\Afeat: filesystem watch mode(\n|\z)', replace = 'feat: reload Git comparisons, patch files and review files as they change, with `--watch` and `mire watch`$1' },
    { pattern = '\Afeat: review init cmd(\n|\z)', replace = 'feat: add `mire review init` to create a review file from a Git comparison$1' },
    { pattern = '\Afeat: location-based note commands(\n|\z)', replace = 'feat: add `mire note add` and `mire notes apply` to write findings at a file and line, and `mire note resolve`, `dismiss` and `accept-risk`$1' },
    { pattern = '\Afeat: bundled skill with command(\n|\z)', replace = 'feat: bundle an agent review skill, installed and located with `mire skill path`$1' },
    { pattern = '\Afeat: bind reviews to Git repo identity(\n|\z)', replace = 'feat: record the Git repository and comparison a review was created from$1' },
    { pattern = '\Afeat: review refresh reanchoring(\n|\z)', replace = 'feat: add `mire review refresh` to capture the comparison again and re-anchor findings as exact, moved, stale or ambiguous$1' },
    { pattern = '\Afeat: export note events and reanchor outcomes(\n|\z)', replace = 'feat: include note events and re-anchor results in `mire notes export`$1' },
    { pattern = '\Afeat: add live TUI session control(\n|\z)', replace = 'feat: add `mire session` commands to inspect and steer an open terminal review$1' },
    { pattern = '\Afeat: contextual TUI keyboard hints(\n|\z)', replace = 'feat: show the keys for the current mode in the terminal review footer$1' },
    { pattern = '\Afeat: make file sidebar toggleable(\n|\z)', replace = 'feat: show or hide the file sidebar in the terminal review with `b`$1' },
    { pattern = '\Afeat: improve TUI note editing and status chrome(\n|\z)', replace = 'feat: edit multiline notes and show review progress in the terminal review$1' },
    { pattern = '\Afeat: collapsible diff rows and file picker(\n|\z)', replace = 'feat: collapse files and hunks, and pick files from a filtered list, in the terminal review$1' },
    { pattern = '\Afeat: add review status and default diff(\n|\z)', replace = 'feat: add `mire review status`, and open the worktree diff when `mire` runs without a command$1' },
    { pattern = '\Afeat: local browser review server(\n|\z)', replace = 'feat: add `mire serve` to open a web review in a local browser$1' },
    { pattern = '\Afeat: add file diff and finding navigation(\n|\z)', replace = 'feat: add file diffs and finding navigation to the web review$1' },
    { pattern = '\Afeat: review patch export(\n|\z)', replace = 'feat: add `mire review export --format patch` to write the captured changes as a patch$1' },
    { pattern = '\Afeat: finding review actions(\n|\z)', replace = 'feat: edit findings and resolve, reopen, dismiss or accept their risk in the web review$1' },
    { pattern = '\Afeat: web review refresh and completion(\n|\z)', replace = 'feat: refresh the source and watch it for changes in the web review, and finish a review with Markdown, JSON and context downloads$1' },
    { pattern = '\Afeat: polish diff review interface(\n|\z)', replace = 'feat: add a split layout, context expansion, a dark theme and mobile drawers to the web review$1' },
    { pattern = '\Afeat: add collapsible file tree navigation(\n|\z)', replace = 'feat: add a collapsible file tree to the web review$1' },
    { pattern = '\Adocs: build doc site(\n|\z)', replace = 'docs: add the documentation site$1' },
    { pattern = '\Adocs: update for completed review workflow(\n|\z)', replace = 'docs: update the README for the review workflow$1' },
    { pattern = '\Adocs: add range and split screencaps(\n|\z)', replace = 'docs: add screencaps of a revision-range review and the split layout$1' },
]
commit_parsers = [
    # Pre-release cleanup: see commit_preprocessors.
    { sha = "525378028b73456c5857902ee315108755505043", skip = true }, # docs: plan the project
    { sha = "94a5f6c10f137d468cf31c4697d46496423c3f97", skip = true }, # docs: clarify tool annotation terminology in docs
    { sha = "1ee4cb6f20a0b86bb53095a5801f4cd39d0d8571", skip = true }, # feat: data model & fixture corpus
    { sha = "7608108d8355faae18b433678cb579bebcc3b1bd", skip = true }, # docs: theming
    { sha = "70c52602f9905bb9c976b781b58f6e8f0172bfd6", skip = true }, # docs: screencap vhs tape
    { sha = "492da48667fc95e4758a67bff6f64dfa7729fef1", skip = true }, # docs: refresh project planning docs
    { sha = "d160b199b745522bd78222fef5fa8dafaca7d0fe", skip = true }, # feat: reorganize docs landing page and add GitHub link
    { sha = "474cda5d32cf4f6a2ba48af8b53fc178101516bc", skip = true }, # feat: add terminal shot component to docs
    { sha = "6bbf1224bafb118ccd744bb0d27f23ea755d2001", skip = true }, # feat: docs SEO metadata and social previews
    { sha = "b31b07da53ee5ac8170f82afb46cf62fc19c8236", skip = true }, # docs: web review roadmap and tasks
    { sha = "2c277bed6fbe95d303ae8d4cc20fde49d5b3d1ab", skip = true }, # docs: cleanup task list
    { sha = "ed6a492a86171bf77baf9396d011eef1a529bcd7", skip = true }, # feat: refine review UI and docs
    { sha = "c14d1917f254e714184aff3afb12c5b6848b363b", skip = true }, # docs: research review tools for walkthroughs (#3)
    { sha = "7409651306712a910b1030c77524529481ed9ad7", skip = true }, # docs: add web review redesign boards (#7)
    { sha = "12f03a92333ffffd5470c4f26f924c18799df686", skip = true }, # docs: design checkpoints and viewed state (#14)
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Changed" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^(chore|ci|build|test|style)", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
