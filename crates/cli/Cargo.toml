[package]
name = "mire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
include = [
    "assets/web/**",
    "build.rs",
    "skills/**",
    "src/**",
    "tests/**",
]

[dependencies]
axum = { version = "0.8.8", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
base64 = "0.22.1"
clap = { version = "4.6.1", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
getrandom = "0.3.4"
include_dir = "0.7.4"
mire-core = { version = "0.1.0", path = "../core" }
mire-tui = { version = "0.1.0", path = "../ui" }
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
open = "5.3.2"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
thiserror.workspace = true
tracing = "0.1.44"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tower-http = { version = "0.6.6", features = ["trace"] }
utoipa = { version = "5.4.0", features = ["axum_extras"] }

[build-dependencies]
clap = { version = "4.6.1", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
clap_complete = "4.6.0"
clap_mangen = "0.2.29"
mire-core = { version = "0.1.0", path = "../core" }
serde_json.workspace = true

[dev-dependencies]
portable-pty = { version = "0.9.0", default-features = false }
tower = { version = "0.5.2", features = ["util"] }

[lints]
workspace = true
